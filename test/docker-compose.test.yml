# Throwaway Postgres for backend tests:
#   docker compose -f test/docker-compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgresql+psycopg://test:test@localhost:5433/test uv run --project backend pytest backend/tests
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 3s
      retries: 20
