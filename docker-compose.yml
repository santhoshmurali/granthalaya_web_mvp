services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-granthalaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-granthalaya}
      POSTGRES_DB: ${POSTGRES_DB:-granthalaya}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-granthalaya}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-granthalaya}:${POSTGRES_PASSWORD:-granthalaya}@db:5432/${POSTGRES_DB:-granthalaya}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  db-data:
  uploads:
